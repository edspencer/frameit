name: API Tests

on:
  deployment_status:

jobs:
  api-tests:
    # Only run when Vercel deployment succeeds
    if: github.event.deployment_status.state == 'success'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run API Tests
        run: pnpm test:api --host ${{ github.event.deployment_status.target_url }}
        env:
          API_HOST: ${{ github.event.deployment_status.target_url }}

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-test-images
          path: test-output/
          retention-days: 7
