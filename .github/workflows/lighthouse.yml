name: Lighthouse CI

on:
  deployment_status:

permissions:
  pull-requests: write

jobs:
  lighthouse:
    if: github.event.deployment_status.state == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Lighthouse CI
        id: lighthouse
        uses: treosh/lighthouse-ci-action@v12
        with:
          urls: |
            ${{ github.event.deployment_status.target_url }}
            ${{ github.event.deployment_status.target_url }}/guides/
            ${{ github.event.deployment_status.target_url }}/guides/why-og-images-matter/
          configPath: ./lighthouserc.json
          uploadArtifacts: true

      - name: Format Lighthouse results
        id: format
        uses: actions/github-script@v7
        with:
          script: |
            const results = ${{ steps.lighthouse.outputs.manifest }};
            const links = ${{ steps.lighthouse.outputs.links }};

            const formatScore = (score) => {
              const percent = Math.round(score * 100);
              if (percent >= 90) return `🟢 ${percent}`;
              if (percent >= 50) return `🟠 ${percent}`;
              return `🔴 ${percent}`;
            };

            let comment = '## Lighthouse Results\n\n';
            comment += '| URL | Performance | SEO | Accessibility | Best Practices |\n';
            comment += '|-----|-------------|-----|---------------|----------------|\n';

            for (const result of results) {
              const url = new URL(result.url).pathname || '/';
              const perf = formatScore(result.summary.performance);
              const seo = formatScore(result.summary.seo);
              const a11y = formatScore(result.summary.accessibility);
              const bp = formatScore(result.summary['best-practices']);
              comment += `| ${url} | ${perf} | ${seo} | ${a11y} | ${bp} |\n`;
            }

            comment += '\n[View full reports in workflow artifacts](' +
              `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`;

            core.setOutput('comment', comment);

      - name: Find PR number
        id: pr
        uses: actions/github-script@v7
        with:
          script: |
            const deployment = context.payload.deployment;
            if (deployment && deployment.payload && deployment.payload.pr_id) {
              return deployment.payload.pr_id;
            }
            // Try to find PR from branch
            const branch = deployment?.ref || context.ref;
            const prs = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              head: `${context.repo.owner}:${branch}`,
              state: 'open'
            });
            return prs.data[0]?.number || null;
          result-encoding: string

      - name: Comment on PR
        if: steps.pr.outputs.result != 'null'
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = ${{ steps.pr.outputs.result }};
            const comment = `${{ steps.format.outputs.comment }}`;

            // Find existing Lighthouse comment
            const comments = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber
            });

            const existing = comments.data.find(c =>
              c.user.type === 'Bot' && c.body.includes('## Lighthouse Results')
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body: comment
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body: comment
              });
            }
